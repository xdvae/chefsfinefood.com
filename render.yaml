# Render Blueprint — one click creates the enquiry database AND the server.
# Render → New → Blueprint → pick this repo → Apply. It asks only for ADMIN_PASSWORD.
databases:
  - name: chefsfinefood-db
    plan: free
    region: singapore
    databaseName: enquiries
    user: chefs

services:
  - type: web
    name: chefsfinefood
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chefsfinefood-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
