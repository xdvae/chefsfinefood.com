<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Enquiries">
<title>Enquiries · The Chef's</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
</defs></svg>

<!-- LOGIN -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-box" autocomplete="on">
    <img src="logo.png" width="88" height="88" alt="">
    <h1>Enquiries</h1>
    <p>The Chef’s Fine Food Caterers · Shree Shyam Caterers</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" class="primary">Log in</button>
    <p class="err" id="loginErr" role="alert"></p>
    <p class="setup" id="setupMsg" hidden></p>
  </form>
</main>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="logo.png" width="38" height="38" alt=""><div><b>Enquiries</b><small>The Chef’s · Shree Shyam</small></div></div>
    <div class="top-actions">
      <button type="button" id="refreshBtn" class="icon-btn" title="Refresh"><svg><use href="#i-refresh"/></svg><span>Refresh</span></button>
      <a id="csvBtn" class="icon-btn" href="#" title="Download for Excel"><svg><use href="#i-download"/></svg><span>Excel</span></a>
      <button type="button" id="logoutBtn" class="icon-btn" title="Log out"><svg><use href="#i-logout"/></svg><span>Log out</span></button>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="Summary">
      <button type="button" class="stat s-new" data-go="new"><span>New</span><b id="stNew">0</b><small>not contacted yet</small></button>
      <div class="stat"><span>Today</span><b id="stToday">0</b><small>received</small></div>
      <div class="stat"><span>This week</span><b id="stWeek">0</b><small>last 7 days</small></div>
      <div class="stat"><span>Upcoming</span><b id="stUpcoming">0</b><small>events in 30 days</small></div>
    </section>

    <section class="controls">
      <div class="searchbox"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search name, phone, venue, notes…" aria-label="Search enquiries"></div>
      <select id="brandSel" aria-label="Brand"><option value="">All brands</option><option value="The Chef's">The Chef’s</option><option value="Shree Shyam">Shree Shyam · Pure Veg</option></select>
      <nav class="tabs" aria-label="Filter by status">
        <button type="button" data-status="" aria-pressed="true">All <i id="cAll">0</i></button>
        <button type="button" data-status="new" aria-pressed="false"><span class="dot new"></span>New <i id="cNew">0</i></button>
        <button type="button" data-status="contacted" aria-pressed="false"><span class="dot contacted"></span>Contacted <i id="cContacted">0</i></button>
        <button type="button" data-status="booked" aria-pressed="false"><span class="dot booked"></span>Booked <i id="cBooked">0</i></button>
        <button type="button" data-status="closed" aria-pressed="false"><span class="dot closed"></span>Closed <i id="cClosed">0</i></button>
      </nav>
    </section>

    <section id="list" class="list" aria-live="polite"></section>
    <p id="empty" class="empty" hidden></p>
  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<template id="cardTpl">
  <article class="card">
    <header class="c-head">
      <span class="avatar" aria-hidden="true"></span>
      <div class="c-who">
        <h2 class="c-name"></h2>
        <p class="c-when"></p>
      </div>
      <span class="c-state"><span class="dot"></span><em></em></span>
    </header>
    <ul class="c-facts"></ul>
    <div class="c-actions">
      <a class="act call"><svg><use href="#i-phone"/></svg><span>Call</span></a>
      <a class="act wa" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg><span>WhatsApp</span></a>
      <a class="act mail" hidden><svg><use href="#i-mail"/></svg><span>Email</span></a>
    </div>
    <dl class="c-details"></dl>
    <div class="c-status" role="group" aria-label="Status">
      <button type="button" data-s="new">New</button>
      <button type="button" data-s="contacted">Contacted</button>
      <button type="button" data-s="booked">Booked</button>
      <button type="button" data-s="closed">Closed</button>
    </div>
    <div class="c-notes">
      <label class="c-label">Notes <em class="saved" hidden>Saved ✓</em></label>
      <textarea rows="2" placeholder="e.g. Called Monday — wants Wazwan, quote sent"></textarea>
    </div>
    <footer class="c-foot"><span class="c-src"></span><button type="button" class="del"><svg><use href="#i-trash"/></svg>Delete</button></footer>
  </article>
</template>

<script src="admin.js" defer></script>
</body>
</html>
